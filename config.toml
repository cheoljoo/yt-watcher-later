# 전역 설정은 반드시 [[playlists]] 위에 둔다 (TOML: 표 아래 키는 그 표에 속함)

# 비공개 목록(WL 등)을 읽어야 할 때만 쿠키 파일 경로를 지정. 비워두면 쿠키를 쓰지 않는다.
cookies = ""

langs = ["ko", "en"]
max_comments = 40
model = "sonnet"

# ── 두 역할로 나눠 쓰기(README 의 '역할 분리' 참고) ──
# 이 컴퓨터 이름이 service_hostnames 에 있으면 서비스 서버(psncs), 없으면 개발 서버. (환경변수 YT_ROLE 또는 ~/.config/yt-watcher-later/role 로 덮어쓸 수 있음)
service_hostnames = ["ideapad-700-15ISK"]
host_aliases = { "ideapad-700-15ISK" = "psncs" }   # 홈 제목에 컴퓨터 이름 대신 보여 줄 이름
# 이 시각 전에는 서비스 서버도 예전처럼(legacy) 전부 한다. 이 시각이 지나야 역할이 갈린다(개발 서버도 이 시각 전에는 실행하지 않음).
split_from = "2026-11-27 06:00"

# 병렬 처리. 수집(yt-dlp)은 429가 나면 자동으로 병렬 수를 줄이고, 잠잠하면 다시 늘린다.
parallel_collect = 3          # 수집 시작 병렬 수 (상한)
max_analyze = 30              # 스킬(yt-daily) 한 번 실행(run_skill.sh 1회)에서 Claude로 분석할 영상 수 상한. 수집은 전부 하고 나머지는 다음 날로 이월
parallel_analyze = 2          # Claude 분석 병렬 수
track_backfill_per_run = 40   # 예전 영상의 배울 점·확인 항목에서 추적 지표를 뽑아 지표에 등록하는 수(실행 1회당, 0이면 끔)
cooldown_sec = 60             # 429 발생 후 쉬는 시간

# 지표 대시보드 맨 위 '🎯 핵심 확인 지표' 묶음. indicators 에는 지표 이름(indicators 표의 이름)을 적는다. 필요 없어지면 묶음을 지우면 된다.
pinned_indicators = [
  { title = "미국 근원 PCE 및 기대인플레이션", why = "2023년 초 이후 최고치(3.3%)와 1년 기대인플레 반등이 연준의 추가 인상 강도를 결정한다.", indicators = ["근원 PCE 물가", "미국 1년 기대인플레이션(미시간대)"] },
  { title = "미국 3분기 GDP 확정치(12월 말) 및 CAPEX 추이", why = "중간선거 전 앞당겨진 AI 설비투자가 4분기·내년 초 성장 둔화로 이어질지 확인해야 한다.", indicators = ["GDP 성장률", "미국 실질 비주거 고정투자 증가율(CAPEX)", "미국 핵심 자본재 신규주문(CAPEX 선행)"] },
  { title = "DRAM 수출가격지수", why = "한국 반도체 이익·수출·성장률 전망을 좌우하는 메모리 가격의 공식 월간 통계(HBM 은 따로 나오지 않는다).", indicators = ["한국 DRAM 수출가격지수(달러)"] },
  { title = "한국 소비자물가·근원물가", why = "지수와 전년 대비 상승률. 2% 목표와의 격차가 한은 긴축 강도를 좌우한다.", indicators = ["한국 소비자물가지수", "한국 소비자물가 상승률(전년동월비)", "한국 근원물가지수(농산물·석유류 제외)", "한국 근원물가 상승률(농산물·석유류 제외, 전년동월비)", "한국 근원물가 상승률(식료품·에너지 제외, 전년동월비)"] },
  { title = "금융권 가계대출 증감 및 수도권 주택 가격", why = "금융안정 판단(대출 확대와 집값)을 함께 본다.", indicators = ["한국 금융권 가계대출 증감(분기)", "한국 가계대출 잔액 증감", "한국 수도권 주택 매매가격지수", "한국 수도권 아파트 매매가격지수"] },
  { title = "달러 인덱스 및 미국 10년물 국채금리", why = "물가 쇼크 이후 금융시장의 긴축 반영 강도를 실시간으로 보여준다.", indicators = ["달러 인덱스", "미국 10년·국채금리"] },
]

# 처리 대상 재생목록 (공개/일부공개 -> 쿠키 불필요). owner = 이 목록에 영상을 모아 두는 사람.
[[playlists]]
owner = "cheoljoo"
name  = "my-watch-later"
url   = "https://www.youtube.com/playlist?list=PLd1vTtizPwPU"

